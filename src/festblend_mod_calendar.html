<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Datas & Agenda de Eventos · Festblend Cuiabá 360</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/auth.js"></script>

  <style>
    /* Custom Luxury Scrollbar */
    * {
      scrollbar-width: thin !important;
      scrollbar-color: #c5a059 #08080a !important;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }
    ::-webkit-scrollbar { width: 6px !important; height: 6px !important; }
    ::-webkit-scrollbar-track { background: #08080a !important; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #f1e3ad 0%, #c5a059 50%, #997836 100%) !important;
      border-radius: 10px !important;
      border: 1px solid #08080a !important;
    }

    body {
      background: var(--bg-deep);
      color: var(--text-main);
      padding: 16px 20px 60px 20px;
      min-height: 100vh;
      overflow-y: auto;
    }

    /* Header Principal do Calendário */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
      background: linear-gradient(135deg, rgba(26, 26, 36, 0.95) 0%, rgba(16, 16, 22, 0.98) 100%);
      border: 1px solid var(--card-border);
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .header-left h1 {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-left h1 i {
      color: var(--gold-primary);
    }

    .header-left p {
      font-size: 0.74rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .controls-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(197, 160, 89, 0.12);
      border: 1px solid rgba(197, 160, 89, 0.35);
      color: var(--gold-primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .view-toggle-bar {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: var(--gold-gradient);
      color: #08080a;
      box-shadow: 0 2px 8px var(--gold-glow);
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 8px;
      border-radius: 8px;
    }

    .month-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-main);
      padding: 0 8px;
      min-width: 130px;
      text-align: center;
      text-transform: capitalize;
    }

    .month-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .month-btn:hover {
      color: var(--gold-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Grid do Calendário Mensal */
    .calendar-container {
      background: var(--bg-surface);
      border: 1px solid var(--card-border);
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-header {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--gold-primary);
      padding: 8px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .day-cell {
      background: var(--card-bg);
      border: 1px solid rgba(197, 160, 89, 0.12);
      border-radius: 10px;
      min-height: 140px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .day-cell:hover {
      border-color: var(--gold-primary);
      transform: translateY(-2px);
      background: var(--card-bg-elevated);
      box-shadow: 0 4px 14px var(--gold-glow);
    }

    .day-cell.other-month {
      opacity: 0.28;
      background: rgba(12, 12, 16, 0.5);
    }

    .day-cell.today {
      border: 1.5px solid var(--gold-primary);
      background: rgba(197, 160, 89, 0.08);
      box-shadow: 0 0 16px rgba(197, 160, 89, 0.25);
    }

    .day-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-sub);
    }

    .day-cell.today .day-number {
      color: var(--gold-primary);
      font-weight: 900;
    }

    .today-tag {
      font-size: 0.6rem;
      font-weight: 900;
      text-transform: uppercase;
      background: var(--gold-gradient);
      color: #08080a;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .events-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    /* Card do Evento dentro do Dia */
    .event-card-box {
      background: var(--card-bg-elevated);
      border: 1px solid rgba(197, 160, 89, 0.22);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .event-card-box:hover {
      border-color: var(--gold-primary);
      background: rgba(197, 160, 89, 0.12);
    }

    .event-card-box.fechado {
      border-left: 3px solid var(--green);
    }

    .event-card-box.critico {
      border-left: 3px solid var(--red);
      background: rgba(239, 68, 68, 0.08);
    }

    .event-card-box.negociacao {
      border-left: 3px solid var(--yellow);
    }

    .event-card-box.degustacao {
      border-left: 3px solid var(--blue);
    }

    .subbox-client-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 3px;
    }

    .subbox-client-name {
      font-size: 0.68rem;
      font-weight: 900;
      color: var(--gold-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subbox-time-badge {
      font-size: 0.58rem;
      font-weight: 800;
      background: rgba(197, 160, 89, 0.15);
      color: var(--gold-light);
      padding: 1px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .subbox-demand-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subbox-value-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.62rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .subbox-val-tag {
      color: var(--gold-light);
      font-weight: 800;
    }

    .subbox-status-tag {
      font-size: 0.58rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .subbox-status-tag.fechado {
      background: rgba(16, 185, 129, 0.2);
      color: var(--green);
    }

    .subbox-status-tag.critico {
      background: rgba(239, 68, 68, 0.25);
      color: var(--red);
    }

    .subbox-status-tag.negociacao {
      background: rgba(245, 158, 11, 0.2);
      color: var(--yellow);
    }

    .subbox-status-tag.degustacao {
      background: rgba(56, 189, 248, 0.2);
      color: var(--blue);
    }

    .more-events-box {
      background: linear-gradient(135deg, rgba(197, 160, 89, 0.2) 0%, rgba(197, 160, 89, 0.08) 100%);
      border: 1px solid var(--gold-primary);
      border-radius: 6px;
      padding: 4px 8px;
      margin-top: 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--gold-light);
      font-size: 0.66rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .more-events-box:hover {
      background: var(--gold-gradient);
      color: #08080a;
    }

    /* Vista Lista Agenda Cronológica */
    .agenda-list-view {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .agenda-item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: all 0.2s;
    }

    .agenda-item-card:hover {
      border-color: var(--gold-primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--gold-glow);
    }

    .agenda-date-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(197, 160, 89, 0.12);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 16px;
      min-width: 90px;
    }

    .agenda-date-day {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--gold-primary);
      line-height: 1;
    }

    .agenda-date-month {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .agenda-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .agenda-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .agenda-sub {
      font-size: 0.76rem;
      color: var(--text-sub);
    }

    .agenda-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action-outline {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--gold-primary);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-action-outline:hover {
      background: var(--gold-gradient);
      color: #08080a;
      border-color: transparent;
    }

    /* Modal Detalhes do Dia */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1.5px solid var(--gold-primary);
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: var(--gold-primary);
    }

    .modal-event-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-event-card:hover {
      border-color: var(--gold-primary);
      background: var(--card-bg-elevated);
    }

    .modal-subbox {
      background: var(--card-bg-elevated);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .event-actions-bar {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      .calendar-grid {
        grid-template-columns: repeat(1, 1fr);
      }
      .day-header {
        display: none;
      }
      .day-cell {
        min-height: auto;
      }
    }
  </style>
</head>
<body>

  <!-- Header Superior da Agenda -->
  <header class="calendar-header">
    <div class="header-left">
      <h1><i data-lucide="calendar"></i> Radar de Datas & Agenda de Eventos</h1>
      <p>Mapeamento de Escassez dos Finais de Semana de Alta Temporada · Cuiabá e Região</p>
    </div>

    <div class="controls-wrap">
      <div class="sync-badge">
        <i data-lucide="database" style="width: 13px; height: 13px;"></i> Cloudflare D1 Ativo
      </div>

      <div class="month-nav">
        <button class="month-btn" onclick="prevMonth()" title="Mês Anterior">
          <i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i>
        </button>
        <span class="month-title" id="monthDisplay">Outubro 2026</span>
        <button class="month-btn" onclick="nextMonth()" title="Próximo Mês">
          <i data-lucide="chevron-right" style="width: 16px; height: 16px;"></i>
        </button>
      </div>

      <div class="view-toggle-bar">
        <button class="view-btn active" id="btnViewGrid" onclick="switchView('grid')">
          <i data-lucide="grid" style="width: 14px; height: 14px;"></i> Grade Mensal
        </button>
        <button class="view-btn" id="btnViewList" onclick="switchView('list')">
          <i data-lucide="list" style="width: 14px; height: 14px;"></i> Lista de Agenda
        </button>
      </div>
    </div>
  </header>

  <!-- Container de Grade Mensal -->
  <main class="calendar-container" id="gridContainer">
    <div class="calendar-grid" id="calendarGrid">
      <!-- Cabeçalho dos 7 Dias da Semana -->
      <div class="day-header">Domingo</div>
      <div class="day-header">Segunda</div>
      <div class="day-header">Terça</div>
      <div class="day-header">Quarta</div>
      <div class="day-header">Quinta</div>
      <div class="day-header">Sexta</div>
      <div class="day-header">Sábado</div>
      <!-- Dias injetados dinamicamente via JavaScript -->
    </div>
  </main>

  <!-- Container de Lista Cronológica da Agenda -->
  <div class="agenda-list-view" id="listContainer">
    <!-- Cards de lista injetados dinamicamente via JavaScript -->
  </div>

  <!-- Modal Detalhes do Dia Selecionado -->
  <div class="modal-backdrop" id="dayModal" onclick="closeDayModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">
          <i data-lucide="calendar" style="color: var(--gold-primary); width: 20px; height: 20px;"></i>
          <span id="modalDateTitle">Sábado, 24 de Outubro de 2026</span>
        </div>
        <button class="modal-close" onclick="closeDayModal()">
          <i data-lucide="x" style="width: 20px; height: 20px;"></i>
        </button>
      </div>
      <div id="modalEventsList">
        <!-- Eventos do dia injetados aqui -->
      </div>
    </div>
  </div>

    let currentDate = new Date(2026, 9, 1); // Outubro 2026 inicial

    function updateMonthDisplay() {
      const monthNames = [
        'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
        'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
      ];
      const monthDisplay = document.getElementById('monthDisplay');
      if (monthDisplay) {
        monthDisplay.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
      }
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    function switchView(mode) {
      const grid = document.getElementById('gridContainer');
      const list = document.getElementById('listContainer');
      const btnGrid = document.getElementById('btnViewGrid');
      const btnList = document.getElementById('btnViewList');

      if (mode === 'grid') {
        grid.style.display = 'block';
        list.style.display = 'none';
        btnGrid.classList.add('active');
        btnList.classList.remove('active');
      } else {
        grid.style.display = 'none';
        list.style.display = 'flex';
        btnGrid.classList.remove('active');
        btnList.classList.add('active');
        renderAgendaList();
      }
    }

    function formatBRL(val) {
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderCalendar() {
      updateMonthDisplay();
      const grid = document.getElementById('calendarGrid');
      if (!grid) return;

      // Mantém os 7 headers de dias da semana
      const headers = Array.from(grid.querySelectorAll('.day-header'));
      grid.innerHTML = '';
      headers.forEach(h => grid.appendChild(h));

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDayDate = new Date(year, month + 1, 0).getDate();
      const prevMonthLastDate = new Date(year, month, 0).getDate();

      // Dias do mês anterior para preenchimento
      for (let i = firstDayIndex; i > 0; i--) {
        const dayNum = prevMonthLastDate - i + 1;
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        cell.innerHTML = `
          <div class="day-top">
            <span class="day-number">${dayNum}</span>
          </div>
        `;
        grid.appendChild(cell);
      }

      // Dias do mês atual
      const today = new Date();
      for (let day = 1; day <= lastDayDate; day++) {
        const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day);

        const eventsOnDay = FESTBLEND_EVENTS.filter(e => e.date === dayStr);

        const cell = document.createElement('div');
        cell.className = `day-cell ${isToday ? 'today' : ''}`;
        cell.onclick = () => openDayModal(dayStr, eventsOnDay);

        let eventsHtml = '';
        if (eventsOnDay.length > 0) {
          eventsOnDay.forEach(ev => {
            eventsHtml += `
              <div class="event-card-box ${ev.status}">
                <div class="subbox-client-header">
                  <span class="subbox-client-name">${ev.clientName}</span>
                  <span class="subbox-time-badge">${ev.time.split('·')[0].trim()}</span>
                </div>
                <div class="subbox-demand-title">${ev.title}</div>
                <div class="subbox-value-footer">
                  <span class="subbox-val-tag">${formatBRL(ev.proposalValue)}</span>
                  <span class="subbox-status-tag ${ev.status}">${ev.statusLabel}</span>
                </div>
              </div>
            `;
          });
        }

        cell.innerHTML = `
          <div class="day-top">
            <span class="day-number">${day}</span>
            ${isToday ? '<span class="today-tag">Hoje</span>' : ''}
          </div>
          <div class="events-container">
            ${eventsHtml}
          </div>
        `;
        grid.appendChild(cell);
      }

      // Dias do próximo mês para completar grade
      const totalCells = firstDayIndex + lastDayDate;
      const nextDays = (7 - (totalCells % 7)) % 7;
      for (let j = 1; j <= nextDays; j++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        cell.innerHTML = `
          <div class="day-top">
            <span class="day-number">${j}</span>
          </div>
        `;
        grid.appendChild(cell);
      }

      lucide.createIcons();
    }

    function renderAgendaList() {
      const listContainer = document.getElementById('listContainer');
      if (!listContainer) return;
      listContainer.innerHTML = '';

      const monthNamesShort = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

      FESTBLEND_EVENTS.sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(ev => {
        const parts = ev.date.split('-');
        const dNum = parts[2];
        const mNum = parseInt(parts[1], 10) - 1;

        const card = document.createElement('div');
        card.className = 'agenda-item-card';
        card.innerHTML = `
          <div class="agenda-date-badge">
            <span class="agenda-date-day">${dNum}</span>
            <span class="agenda-date-month">${monthNamesShort[mNum]} 2026</span>
          </div>

          <div class="agenda-info">
            <div class="agenda-title">${ev.title}</div>
            <div class="agenda-sub">
              <strong>${ev.location}</strong> · ${ev.guests > 0 ? ev.guests + ' convidados · ' : ''}${ev.drinks}
            </div>
            <div class="agenda-sub" style="margin-top: 4px;">
              Responsável: <strong style="color: var(--gold-light);">${ev.responsible}</strong> · 
              Valor: <strong style="color: var(--green);">${formatBRL(ev.proposalValue)}</strong> · 
              Status: <span class="subbox-status-tag ${ev.status}">${ev.statusLabel}</span>
            </div>
          </div>

          <div class="agenda-actions">
            <button class="btn-action-outline" onclick="openDayModal('${ev.date}', [${JSON.stringify(ev).replace(/"/g, '&quot;')}])">
              <i data-lucide="eye" style="width: 14px; height: 14px;"></i> Detalhes
            </button>
            <a href="https://web.whatsapp.com" target="_blank" class="btn-action-outline" style="border-color: rgba(16, 185, 129, 0.4); color: var(--green);">
              <i data-lucide="message-square" style="width: 14px; height: 14px;"></i> WhatsApp
            </a>
          </div>
        `;
        listContainer.appendChild(card);
      });

      lucide.createIcons();
    }

    function openDayModal(dateStr, events) {
      const modal = document.getElementById('dayModal');
      const title = document.getElementById('modalDateTitle');
      const list = document.getElementById('modalEventsList');

      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const dateFormatted = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      title.textContent = dateFormatted.charAt(0).toUpperCase() + dateFormatted.slice(1);

      if (!events || events.length === 0) {
        list.innerHTML = `
          <div style="text-align: center; padding: 30px; color: var(--text-muted);">
            <i data-lucide="calendar-x" style="width: 32px; height: 32px; margin-bottom: 8px;"></i>
            <p>Nenhum evento agendado para esta data.</p>
            <button class="btn-action-outline" style="margin-top: 14px;" onclick="closeDayModal()">
              Fechar
            </button>
          </div>
        `;
      } else {
        let html = '';
        events.forEach(ev => {
          html += `
            <div class="modal-event-card">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-size: 1.05rem; font-weight: 800; color: var(--gold-light);">${ev.title}</h3>
                <span class="subbox-status-tag ${ev.status}" style="font-size: 0.72rem; padding: 4px 8px;">${ev.statusLabel}</span>
              </div>

              <div class="modal-subbox">
                <span style="font-size: 0.74rem; color: var(--text-muted);">Local do Evento</span>
                <strong style="color: var(--text-main); font-size: 0.85rem;">${ev.location}</strong>
                <span style="font-size: 0.72rem; color: var(--text-sub);">${ev.time}</span>
              </div>

              <div class="modal-subbox">
                <span style="font-size: 0.74rem; color: var(--text-muted);">Estrutura & Cardápio de Drinks</span>
                <strong style="color: var(--gold-primary); font-size: 0.85rem;">${ev.drinks}</strong>
                <span style="font-size: 0.72rem; color: var(--text-sub);">${ev.guests} convidados previstos</span>
              </div>

              <div class="modal-subbox" style="display: flex; justify-content: space-between; flex-direction: row; align-items: center;">
                <div>
                  <span style="font-size: 0.72rem; color: var(--text-muted);">Valor da Proposta</span>
                  <div style="font-size: 1.1rem; font-weight: 900; color: var(--green);">${formatBRL(ev.proposalValue)}</div>
                </div>
                <div>
                  <span style="font-size: 0.72rem; color: var(--text-muted);">Sinal Pago via PIX</span>
                  <div style="font-size: 1.1rem; font-weight: 900; color: var(--gold-light);">${formatBRL(ev.signalPaid)}</div>
                </div>
                <div>
                  <span style="font-size: 0.72rem; color: var(--text-muted);">Responsável</span>
                  <div style="font-size: 0.85rem; font-weight: 800; color: var(--text-main);">${ev.responsible}</div>
                </div>
              </div>

              ${ev.notes ? `
                <div style="background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; color: var(--text-sub); border-left: 2px solid var(--gold-primary);">
                  <strong>Observação Comercial:</strong> ${ev.notes}
                </div>
              ` : ''}

              <div class="event-actions-bar">
                <a href="https://web.whatsapp.com" target="_blank" class="btn-action-outline" style="border-color: rgba(16, 185, 129, 0.5); color: var(--green);">
                  <i data-lucide="message-square" style="width: 14px; height: 14px;"></i> Abrir Conversa no WhatsApp
                </a>
                <button class="btn-action-outline" onclick="alert('Dados salvos no Cloudflare D1 com sucesso.')">
                  <i data-lucide="check" style="width: 14px; height: 14px;"></i> Confirmar Presença
                </button>
              </div>
            </div>
          `;
        });
        list.innerHTML = html;
      }

      modal.classList.add('active');
      lucide.createIcons();
    }

    function closeDayModal() {
      const modal = document.getElementById('dayModal');
      if (modal) modal.classList.remove('active');
    }

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      renderCalendar();
    });
  </script>
</body>
</html>
