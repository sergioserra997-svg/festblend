server {
    listen 80;
    listen [::]:80;
    server_name festblendcrm.aisecompany.com.br festbledncrm.aisecompany.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name festblendcrm.aisecompany.com.br festbledncrm.aisecompany.com.br;

    root /var/www/aisecompany/festblend;
    index index.html festblend_hub_desktop.html;
    ssl_certificate /etc/letsencrypt/live/gestao.aisecompany.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestao.aisecompany.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-hardening.conf;

    add_header X-Client-ID "festblend" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

    access_log /var/log/nginx/festblend_access.log;
    error_log /var/log/nginx/festblend_error.log;

    autoindex off;

    # Proxy reverso seguro para Cloudflare D1 (festblend-db)
    location /api/d1/query {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $cf_d1_festblend "https://api.cloudflare.com/client/v4/accounts/952c2920af5b8e5db656b378e7a80b53/d1/database/780cd440-a787-4e85-9e26-f642c3852c0e/query";
        proxy_pass $cf_d1_festblend;
        proxy_ssl_server_name on;
        proxy_ssl_name api.cloudflare.com;
        proxy_set_header Host api.cloudflare.com;
        proxy_set_header Authorization "Bearer ${CLOUDFLARE_D1_TOKEN}";
        proxy_set_header Content-Type "application/json";
        proxy_read_timeout 60s;
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Proxy reverso seguro para Evolution API WhatsApp
    location ^~ /api/evolution/ {
        rewrite ^/api/evolution/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header apikey "${EVOLUTION_API_KEY}";
        proxy_cache_bypass $http_upgrade;
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, apikey' always;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, apikey';
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    location / {
        try_files $uri $uri/ /index.html /festblend_hub_desktop.html =404;
    }
}
